[project]
name = "qwork"
version = "0.1.0"
description = "Launch AI coding agents on Q project board tasks"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
qwork = "qwork.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwork"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
